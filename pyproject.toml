[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-action-hub"
version = "0.1.1"
description = "Restricted Plow Chat screenshot-to-Linear gateway"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.13.4", "Pillow==11.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
